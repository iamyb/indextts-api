# IndexTTS-2.5 API service (Docker deployment)
#
# Prerequisites: host ./checkpoints/ must contain all model weights
#   (gpt.pth / s2mel.pth / codec.pth / tiktoken / wav2vec2bert_stats.pt / hf_cache/)
#
# Usage:
#   docker compose up -d --build     # Build and start
#   docker compose logs -f           # Check logs (model loading takes ~1-2 minutes)
#   curl http://127.0.0.1:8000/health
#
# Test synthesis:
#   curl -X POST http://127.0.0.1:8000/tts \
#     -F "text=Hello" -F "ref_audio=@examples/voice_01.wav" -F "lang=ZH" -o out.wav

services:
  indextts-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pin upstream version (tag/commit), defaults to main
        INDEXTTS_REF: ${INDEXTTS_REF:-main}
        # Build-time proxy (needed for downloading astral.sh/github/pypi on China networks; leave empty if not needed).
        # Pass via environment variables, e.g.: HTTP_PROXY=http://host:port docker compose build
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    image: indextts-api:latest
    container_name: indextts-api
    ports:
      - "8000:8000"
    environment:
      # Model directory (in-container path, matches VOLUME in Dockerfile)
      MODEL_DIR: /models/checkpoints
      # Voices directory (for OpenAI-compatible endpoints)
      VOICES_DIR: /models/voices
      # No proxy inside the container
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      # Prevent attempting to download models from the network at startup (models are already mounted)
      USE_MODELSCOPE: "false"
    volumes:
      # Host model directory -> container (read-only)
      - ./checkpoints:/models/checkpoints:ro
      # Voices directory (reference audio for OpenAI-compatible endpoints, read-write)
      - ./voices:/models/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Optional: uncomment to enable emotion text control
    # command: ["python", "api_server.py", "--host", "0.0.0.0", "--port", "8000", "--qwen_emo"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      # Model loading takes 1-2 minutes; allow sufficient startup time
      start_period: 300s
      retries: 3
